{% extends "sheader.html" %}
{% load static %}
<html>
{% block content %}
     
    <div class="breadcrumbs">
        <div class="container">
            <div class="row">
                <div class="col">
                    <p class="bread"><span><a href="index.html">Home</a></span> / <span>Profile</span></p>
                </div>
            </div>
        </div>
    </div>
 
 
    <div id="colorlib-contact">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                <div class="contact-wrap">
                    {% if msg %}
                    <div class="alert alert-success" role="alert">
                        {{msg}}
                     </div>
                    {% endif %}
                    <h3>Update Profile</h3>
                    <form method="post" action="{% url 'profile' %}" class="contact-form" enctype="multipart/form-data">
                    {% csrf_token %}
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="fname">First Name</label>
                                    <input type="text" name="fname" id="fname" class="form-control" value="{{user.fname}}">
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="lname">Last Name</label>
                                    <input type="text" name="lname" id="lname" class="form-control" value="{{user.lname}}">
                                </div>
                            </div>
                            <div class="w-100"></div>
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input disabled type="email" name="email" id="email" class="form-control" value="{{user.email}}">
                                </div>
                            </div>
                            <div class="w-100"></div>
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <label for="mobile">Mobile No.</label>
                                    <input type="Number" name="mobile" id="mobile" class="form-control" value="{{user.mobile}}">
                                </div>
                            </div>
                            <div class="w-100"></div>
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <img src="{{user.profile.url}}" alt="" style="width: 100px; height: 100px;">
                                </div>
                            </div>
                            <div class="w-100"></div>
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <input type="file" name="profile" value="{{user.profile.url}}">
                                </div>
                            </div>
                            <div class="w-100"></div>
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <input type="submit" value="Update-Profile" class="btn btn-primary">
                                </div>
                            </div>
                        </div>
                    </form>		
                </div>
                </div>
            </div>
        </div>
    </div>
 {% endblock %}
 </html>
