{% extends "sheader.html" %}
{% load static %}
{% block content %}	

<div class="colorlib-product">
    <div class="container">
        <div class="row">
            <div class="col-sm-8 offset-sm-2 text-center colorlib-heading">
                <h2>Best Sellers</h2>
            </div>
        </div>
        <div class="row row-pb-md">
            {% for i in product %}
            <div class="col-lg-3 mb-2 text-center">                
                <div class="border">
                    <h5><a href="{% url 'spdetails' pk=i.pk %}">{{i.bname}}</a></h5>
                    <a href="{% url 'spdetails' pk=i.pk %}" class="prod-img">
                        <img src = "{{i.pimage.url}}" class="h-50 img-fluid" alt="Free html5 bootstrap 4 template">
                    </a>
                    <div class="desc">
                        <h5><a href="{% url 'spdetails' pk=i.pk %}">{{i.bname}}</a></h5>
                        <h5><a href="{% url 'spdetails' pk=i.pk %}">{{i.pname}}</a></h5>
                        {% comment %} <p>{{i.desc}}</p> {% endcomment %}
                        <span class="price">{{i.price}} Rs.</span>
						<p><a href="{% url 'spdetails' pk=i.pk %}" class="btn btn-primary btn-lg">More Details</a></p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
